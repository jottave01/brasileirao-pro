<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldMain" x1="25" y1="10" x2="95" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="35%" stop-color="#FACC15" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="goldDark" x1="35" y1="65" x2="85" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="sphereGrad" x1="40" y1="12" x2="78" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
  </defs>

  <!-- Fundo circular escuro elegante -->
  <rect width="120" height="120" rx="28" fill="#0B111A" />
  <circle cx="60" cy="46" r="42" fill="rgba(250, 204, 21, 0.10)" />

  <!-- Base escalonada piramidal estilizada (inspirada na taça oficial) -->
  <rect x="26" y="102" width="68" height="8" rx="2.5" fill="url(#goldDark)" stroke="#FDE047" stroke-width="0.8" />
  <rect x="33" y="92" width="54" height="10" rx="2" fill="url(#goldMain)" />
  <!-- Faixa verde e amarela na base -->
  <rect x="36" y="95" width="48" height="4" rx="1" fill="#15803D" />
  <rect x="44" y="95.5" width="32" height="3" rx="0.8" fill="#FACC15" />

  <!-- Hastes / Colunas da Taça -->
  <path d="M 41 92 L 48 62 L 72 62 L 79 92 Z" fill="url(#goldMain)" />
  <path d="M 52 92 L 55 62 L 65 62 L 68 92 Z" fill="#92400E" opacity="0.4" />

  <!-- Aros orbitais ao redor da esfera -->
  <ellipse cx="60" cy="37" rx="34" ry="13" transform="rotate(-18 60 37)" stroke="url(#goldMain)" stroke-width="4.2" fill="none" />
  <ellipse cx="60" cy="37" rx="34" ry="13" transform="rotate(18 60 37)" stroke="url(#goldMain)" stroke-width="4.2" fill="none" />

  <!-- Esfera dourada central (globo do troféu) -->
  <circle cx="60" cy="37" r="21" fill="url(#sphereGrad)" stroke="#FEF9C3" stroke-width="1.2" />
  <!-- Detalhe de gomos sutis de bola -->
  <path d="M 42 32 Q 60 40 78 32" stroke="#92400E" stroke-width="1.4" opacity="0.45" fill="none" />
  <path d="M 44 45 Q 60 37 76 45" stroke="#92400E" stroke-width="1.4" opacity="0.45" fill="none" />
  <path d="M 60 16 Q 66 37 60 58" stroke="#92400E" stroke-width="1.4" opacity="0.4" fill="none" />
  <!-- Brilho metálico -->
  <ellipse cx="52" cy="27" rx="6" ry="3.5" transform="rotate(-25 52 27)" fill="#FFFFFF" opacity="0.55" />

  <!-- Aros frontais sobrepostos -->
  <path d="M 27 44 Q 60 53 93 29" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />
</svg>
